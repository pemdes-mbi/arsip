<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 - Kesalahan Internal Server | Sistem Arsip Desa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F3F4F6;
            color: #1F2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            max-width: 540px;
            width: 90%;
            background: #ffffff;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: #D97706;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .btn-desa {
            background-color: #0F5A3E;
            color: #ffffff;
            font-weight: 600;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .btn-desa:hover {
            background-color: #0c4832;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">500</div>
        <h4 class="fw-bold text-dark mb-2">Terjadi Kesalahan Server</h4>
        <p class="text-muted mb-4">Terjadi kendala teknis internal pada sistem saat memproses permintaan Anda. Tim pengelola sistem telah mencatat kejadian ini. Silakan coba kembali beberapa saat lagi.</p>
        <a href="/" class="btn btn-desa">
            <i class="bi bi-house-door-fill me-2"></i>Kembali ke Beranda
        </a>
    </div>
</body>
</html>
