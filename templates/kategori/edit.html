{% extends 'base.html' %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'arsip:kategori_list' %}" class="text-decoration-none text-muted mb-2 d-inline-block"><i class="bi bi-arrow-left me-1"></i>Kembali ke Daftar Kategori</a>
    <h4 class="fw-bold text-dark mb-1">EDIT KATEGORI</h4>
    <p class="text-muted small mb-0">Ubah penamaan klasifikasi dokumen arsip desa.</p>
</div>

<div class="row">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="{{ form.nama.id_for_label }}" class="form-label text-muted small fw-bold text-uppercase">Nama Kategori Dokumen <span class="text-danger">*</span></label>
                        {{ form.nama }}
                        {% if form.nama.errors %}
                            <div class="text-danger small mt-2"><i class="bi bi-exclamation-triangle me-1"></i>{{ form.nama.errors.0 }}</div>
                        {% endif %}
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-5">
                        <a href="{% url 'arsip:kategori_list' %}" class="btn btn-light border px-4">Batal</a>
                        <button type="submit" class="btn btn-warning px-4 fw-bold text-dark">
                            <i class="bi bi-save me-1"></i> Perbarui Kategori
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
